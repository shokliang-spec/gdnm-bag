<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>好市袋著走｜花園夜市</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* 活動公版色：米白底、深藍主色、紅色強調、橄欖綠標籤 */
:root{
  --bg:#fdf7eb; --card:#ffffff; --line:#e6dcc6; --ink:#24304f; --muted:#7c7563;
  --navy:#1e3a8a; --red:#dc2626; --olive:#6e7a2d; --ok:#15803d; --warn:#b45309;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Noto Sans TC',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100dvh;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;flex-direction:column;flex:1;min-width:0}
.logo{width:46px;height:auto;flex:0 0 auto}
.art{display:flex;flex-direction:column;gap:10px;align-items:center}
.art .hero-img{width:100%;height:auto;display:block;border-radius:16px}
.badge{display:flex;align-items:center;gap:10px;background:#1f2a44;border-radius:14px;padding:6px 14px 6px 6px;max-width:100%}
.badge img{height:38px;width:auto;border-radius:10px;flex:0 0 auto}
.badge span{color:#fff;font-weight:700;font-size:14px;line-height:1.35;min-width:0}
.phone{font-family:var(--mono);color:var(--navy);text-decoration:none;font-weight:700}
.brand b{font-size:20px;font-weight:900;color:#13678c;letter-spacing:.06em}
.brand small{font-size:11px;color:#13678c;letter-spacing:.22em;font-weight:500}
.tag{font-size:12px;font-weight:700;color:#fff;background:var(--olive);padding:4px 10px;border-radius:99px;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-right:6px;vertical-align:middle}
.dot.on{background:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
h2{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.06em}
label{font-size:13px;color:var(--muted);font-weight:500}
input,select{font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus{outline:none;border-color:var(--navy)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
button{font:inherit;font-weight:700;border:none;border-radius:12px;padding:14px 16px;font-size:17px;cursor:pointer;background:var(--navy);color:#fff}
button:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
button.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
button.red{background:var(--red)}
button.sm{padding:8px 12px;font-size:14px}
button:disabled{opacity:.4;cursor:not-allowed}
.amount{font-family:var(--mono);font-size:44px;font-weight:700;text-align:center;letter-spacing:.02em;padding:8px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{background:#f3ecdc;color:var(--ink);font-size:24px;padding:14px 0}
.keys button.fn{font-size:16px;color:var(--muted)}
.big{font-family:var(--mono);font-size:56px;font-weight:700;letter-spacing:.18em;text-align:center;color:var(--navy)}
.qr{display:flex;justify-content:center;padding:6px}
.qr img,.qr canvas{width:220px!important;height:220px!important}
.msg{font-size:15px;padding:10px 12px;border-radius:10px;background:#f3ecdc}
.msg.ok{background:#dcfce7;color:var(--ok)} .msg.bad{background:#fee2e2;color:var(--red)} .msg.warn{background:#fef3c7;color:var(--warn)}
.stock{display:flex;align-items:baseline;justify-content:center;gap:8px}
.stock b{font-family:var(--mono);font-size:64px;color:var(--red);line-height:1}
.stock span{font-size:18px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line);font-size:14px}
.item:first-child{border-top:none}
.item .code{font-family:var(--mono);font-weight:700;color:var(--navy)}
.item .sub{color:var(--muted);font-size:12px}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:#dcfce7;color:var(--ok)} .pill.wait{background:#e0e7ff;color:var(--navy)} .pill.paper{background:#fef3c7;color:var(--warn)}
.proof{border:3px solid var(--navy);border-radius:18px;background:#fff;overflow:hidden}
.proof .hd{background:var(--red);color:#fff;text-align:center;padding:14px;font-weight:900;font-size:24px;letter-spacing:.12em}
.proof .bd{padding:16px;display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:16px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.kv span{color:var(--muted)} .kv b{text-align:right}
.stamp{align-self:center;font-size:26px;font-weight:900;padding:6px 18px;border:4px solid currentColor;border-radius:10px;transform:rotate(-6deg);letter-spacing:.1em}
.tabs{display:flex;gap:6px;background:#efe6d2;padding:4px;border-radius:12px}
.tabs button{flex:1;background:transparent;color:var(--muted);padding:10px 4px;font-size:15px}
.tabs button.on{background:#fff;color:var(--navy)}
.foot{font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.seq{font-size:20px;font-weight:900;color:var(--red)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.toggle input{width:auto;transform:scale(1.4)}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}}
.bar{height:14px;background:#efe6d2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--olive),var(--ok));border-radius:99px;transition:width .4s}
.progress{display:flex;justify-content:space-between;align-items:baseline}
.progress b{font-family:var(--mono);font-size:36px;color:var(--navy)}
.progress span{color:var(--muted)}
.quota{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px}
.quota b{font-family:var(--mono);font-size:26px;color:var(--red)}
.hero{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.hero .n{font-size:22px;font-weight:900;color:var(--ok)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
.check input{width:auto;margin-top:3px;transform:scale(1.3)}
textarea{font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;width:100%;min-height:110px}
.tabs button{font-size:14px}
[hidden]{display:none!important}
#view{display:flex;flex-direction:column;gap:14px}
</style>
</head>

<script>

const db = firebase.database();

const MIN = 500;
const DEFAULTS = { weekly: 15 };
const CHARS = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n || 0).toLocaleString('zh-TW');
const today = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' });   // YYYY-MM-DD
const weekOf = day => {                                   // 週一為一週開始
  const d = new Date(day + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7);
  return d.toISOString().slice(0, 10);
};
const weekLabel = wk => { const d = new Date(wk + 'T12:00:00Z'); const e = new Date(d); e.setUTCDate(e.getUTCDate() + 6);
  return `${d.getUTCMonth()+1}/${d.getUTCDate()}–${e.getUTCMonth()+1}/${e.getUTCDate()}`; };
const hm = t => t ? new Date(t).toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false }) : '';
const md = d => d ? d.slice(5).replace('-', '/') : '';
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem('bag_' + k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem('bag_' + k, JSON.stringify(v)); } catch {} }
};
const baseURL = location.origin + location.pathname;
const maskPhone = p => p ? p.slice(0,4) + '-***-' + p.slice(-3) : '';
const telLink = p => /^09\d{8}$/.test(p || '') ? `<a class="phone" href="tel:${p}">${p}</a>` : esc(p || '');
const randCode = n => { let c = ''; for (let i = 0; i < n; i++) c += CHARS[Math.floor(Math.random() * CHARS.length)]; return c; };

const q = new URLSearchParams(location.search);
const MODE = q.has('desk') ? 'desk' : 'customer';
const MODE_NAME = MODE === 'desk' ? '服務台' : '集點卡';
if (MODE === 'desk') document.getElementById('art').hidden = true;

db.ref('.info/connected').on('value', s => {
  const on = !!s.val();
  $('#conn').classList.toggle('on', on);
  $('#modeTag').lastChild.textContent = on ? MODE_NAME : '離線';
});
$('#modeTag').lastChild.textContent = MODE_NAME;

// 共用即時資料
let settings = { ...DEFAULTS }, weekData = {};
const WK = weekOf(today());
let refresh = () => {};
R('settings').on('value', s => { settings = { ...DEFAULTS, ...(s.val() || {}) }; refresh(); });
R('weeks/' + WK).on('value', s => { weekData = s.val() || {}; refresh(); });
const used = () => weekData.used || 0;
const left = () => Math.max(0, settings.weekly - used());

// 搶本週名額：used = 目前有效名額數，n = 清冊序號（只增不減）
async function takeSlot(wk = WK){
  const r = await R('weeks/' + wk).transaction(w => {
    w = w || { used: 0, n: 0 };
    if ((w.used || 0) >= settings.weekly) return;          // 中止＝名額已滿
    return { ...w, used: (w.used || 0) + 1, n: (w.n || 0) + 1 };
  });
  return r.committed ? r.snapshot.val().n : null;
}
// 候補序號：只增不減
async function joinWait(wk = WK){
  const r = await R('weeks/' + wk + '/wn').transaction(n => (n || 0) + 1);
  return r.snapshot.val();
}
const isWait = c => c && (c.status === 'wait' || c.status === 'full');
// 達標當日要領取，隔天起視同放棄
const slotDay = c => c.slotAt ? new Date(c.slotAt).toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' }) : c.day;
const overdue = c => c && c.status === 'in' && !c.claimed && slotDay(c) < today();
const gone = c => c && (c.status === 'void' || c.status === 'expired');
async function releaseSlot(wk){
  await R('weeks/' + wk + '/used').transaction(n => Math.max(0, (n || 1) - 1));
}

          <div><label for="tl">手機號碼（名額釋出時通知遞補用）</label><input id="tl" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="09xxxxxxxx"></div>
          <label class="check" for="ag"><input type="checkbox" id="ag"><span>我同意姓名與手機號碼僅供本活動兌換、簽收核對及遞補通知使用，活動結束後刪除。</span></label>
          <div id="err"></div>
          <button id="mk">建立集點卡</button>
        </div>`;
      $('#mk').onclick = create;
      return;
    }
    const total = card.total || 0, pct = Math.min(100, total / MIN * 100);
    const items = Object.values(card.items || {}).sort((a,b) => a.ts - b.ts);
    let status = '';
    if (card.claimed) status = `
      <div class="hero"><div class="stamp" style="color:var(--ok)">已領取</div>
        <p style="color:var(--muted)">${md(card.claimedDay)} ${hm(card.claimedAt)} 已在服務台領取茄芷袋，謝謝參加！</p></div>`;
    else if (card.status === 'expired' || overdue(card)) status = `
      <div class="msg bad"><b>逾期未領取，視同放棄。</b><br>達標當日沒有到服務處領取，名額已讓給其他民眾。</div>
      <button class="ghost" id="newCard">開一張新的集點卡</button>`;
    else if (card.status === 'in') status = `
      <div class="hero pop"><div class="n">${card.promoted ? '遞補成功！輪到你了' : `恭喜！你在本週 ${settings.weekly} 個名額內`}</div>
        <p>請到 <b>花園夜市服務處門口（臨海安路側）</b><br>出示這個畫面，簽名後領取茄芷袋</p>
        <div class="msg bad" style="font-weight:700">請於今天（${md(slotDay(card))}）領取，未領取視同放棄！</div></div>`;
    else if (isWait(card)) status = `
      <div class="msg warn pop" style="font-size:15px;line-height:1.7"><b style="font-size:17px">已累計滿 $${MIN}！本週 ${settings.weekly} 個名額已滿</b><br>
        你是 <b style="font-size:20px;color:var(--red)">候補第 ${card.waitNo || '?'} 位</b><br>
        如有完成者沒有來領，將會通知你遞補。名額釋出時，這張卡會自動變成「遞補成功」，請稍後再打開這個網頁查看。</div>`;
    else if (left() === 0) status = `<div class="msg warn">本週名額已滿，繼續累計滿 $${MIN} 可以登記候補</div>`;

    V.innerHTML = `
      <div class="card">${quotaHTML()}</div>
      <div class="proof">
        <div class="hd">好市袋著走 集點卡</div>
        <div class="bd">
          <div class="big">${esc(code)}</div>
          <div class="kv"><span>姓名</span><b>${esc(card.name)}（手機末 3 碼 ${esc(card.tail)}）</b></div>
          <div class="progress"><span>已累計</span><b>${money(total)}</b><span>/ $${MIN}</span></div>
          <div class="bar"><i style="width:${pct}%"></i></div>
          ${total < MIN && !card.status ? `<p style="text-align:center;color:var(--muted)">還差 <b style="color:var(--red)">${money(MIN - total)}</b></p>` : ''}
          ${status}
        </div>
      </div>
      ${!card.status ? `<button id="ask" class="red">＋ 新增一筆消費</button>` : ''}
      <div class="card" id="confirm" hidden></div>
      <div class="card"><h2>已登記的消費</h2><div class="list">${items.length ? items.map(i => `
        <div class="item"><span class="code">${esc(i.stall)}</span><div><div class="sub">${hm(i.ts)}</div></div><b>${money(i.amount)}</b></div>`).join('')
        : '<p style="color:var(--muted);font-size:14px">還沒有消費紀錄。買完東西後，請老闆確認攤位排號和消費金額，再按上方按鈕新增。</p>'}</div></div>`;
    if ($('#newCard')) $('#newCard').onclick = () => { code = null; store.set('card', null); listen(); };
    if ($('#ask')) $('#ask').onclick = () => { panel = true; showConfirm(); };
    if (panel) showConfirm();
  }

  async function create(){
    const name = $('#nm').value.trim(), phone = $('#tl').value.replace(/\D/g, ''), tail = phone.slice(-3);
    if (!name) { $('#err').innerHTML = `<div class="msg bad">請填姓名</div>`; return; }
    if (!/^09\d{8}$/.test(phone)) { $('#err').innerHTML = `<div class="msg bad">請填 10 碼手機號碼，例如 0912345678</div>`; return; }
    if (!$('#ag').checked) { $('#err').innerHTML = `<div class="msg bad">請勾選同意後再建立</div>`; return; }
    $('#mk').disabled = true;
    for (let i = 0; i < 12; i++){
      const c = randCode(4);
      const r = await R('cards/' + c).transaction(cur => cur === null
        ? { name, tail, day: today(), week: WK, created: Date.now(), total: 0, status: '', claimed: false } : undefined);
      if (r.committed) { await R('contacts/' + c).set({ name, phone, ts: Date.now() }); code = c; store.set('card', c); listen(); return; }
    }
    $('#mk').disabled = false; $('#err').innerHTML = `<div class="msg bad">建立失敗，請確認網路後再試一次</div>`;
  }

  function showConfirm(){
    const el = $('#confirm'); if (!el) return;
    el.hidden = false;
    el.innerHTML = `
      <h2>新增一筆消費</h2>
      <div class="msg warn" style="font-size:15px;line-height:1.7"><b>請向老闆確認兩件事：</b><br>
        ① 攤位是<b>幾排幾號</b>（攤位有好幾格的，任選其中一格的排號即可）<br>
        ② 這次的<b>消費金額</b></div>
      <div class="row">
        <div><label for="rw">第幾排</label><input id="rw" inputmode="numeric" maxlength="3" placeholder="例：3" autocomplete="off"></div>
        <div><label for="no">第幾號</label><input id="no" inputmode="numeric" maxlength="3" placeholder="例：12" autocomplete="off"></div>
      </div>
      <div><label for="am">消費金額（請老闆確認）</label><input id="am" inputmode="numeric" placeholder="例：120" autocomplete="off"></div>
      <div id="cerr"></div>
      <div class="row"><button class="ghost" id="cx">取消</button><button id="ok">加入累計</button></div>`;
    $('#cx').onclick = () => { panel = false; el.hidden = true; };
    $('#ok').onclick = submit;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  async function submit(){
    const rw = $('#rw').value.trim(), no = $('#no').value.trim(), amount = parseInt($('#am').value, 10) || 0;
    const err = t => $('#cerr').innerHTML = `<div class="msg bad">${t}</div>`;
    if (!/^[0-9A-Za-z]{1,3}$/.test(rw) || !/^\d{1,3}$/.test(no)) return err('請填攤位的排和號（問老闆就知道）');
    if (amount <= 0 || amount > 50000) return err('請輸入正確的金額');
    const stall = `${rw.toUpperCase()}排${no}號`;
    $('#ok').disabled = true;
    const item = { stall, amount, ts: Date.now() };
    const r = await R('cards/' + code).transaction(c => {
      if (!c || c.status) return;
      const key = 'i' + item.ts + randCode(3);
      c.items = { ...(c.items || {}), [key]: item };
      c.total = (c.total || 0) + amount;
      return c;
    });
    if (!r.committed) { $('#ok').disabled = false; return err('這張集點卡已達標或已失效'); }
    panel = false;
    if (r.snapshot.val().total >= MIN){
      const n = await takeSlot();
      await R('cards/' + code).update(n ? { status: 'in', slot: n, week: WK, slotAt: Date.now() }
                                         : { status: 'wait', waitNo: await joinWait(WK), week: WK, waitAt: Date.now() });
    }
  }

  listen();
}

/* ═════════ 服務台 ═════════ */
function deskView(){
  let tab = 'claim', cur = null, curCode = '', weekCards = [], logWeek = WK, offWeek = null, contacts = {}, offContacts = null;
  const auth = firebase.auth();
  const ph = c => contacts[c.code]?.phone || c.tail || '';

  function lock(msg = ''){
    if (offWeek) { offWeek(); offWeek = null; }
    if (offContacts) { offContacts(); offContacts = null; }
    $('#view').innerHTML = `
      <div class="card"><h2>服務台登入</h2>
        <div><label for="em">帳號</label><input id="em" autocomplete="username" autocapitalize="off" placeholder="例：desk"></div>
        <div><label for="pw">密碼</label><input id="pw" type="password" autocomplete="current-password"></div>
        <button id="in">登入</button><div id="err">${msg}</div></div>`;
    const go = async () => {
      $('#in').disabled = true;
      let acc = $('#em').value.trim().toLowerCase(); if (acc && !acc.includes('@')) acc += '@gdnm.life';
      try { await auth.signInWithEmailAndPassword(acc, $('#pw').value); }
      catch (e) {
        $('#in').disabled = false;
        const why = {
          'auth/invalid-credential': '帳號或密碼不對。請確認 Firebase「Authentication → 使用者」裡有這個帳號，密碼也打對。',
          'auth/wrong-password': '密碼不對，請再試一次。',
          'auth/user-not-found': '找不到這個帳號，請到 Firebase「Authentication → 使用者」新增。',
          'auth/invalid-email': '帳號格式不對，只能用英文字母、數字。',
          'auth/operation-not-allowed': 'Firebase 還沒開啟「電子郵件/密碼」登入，請到 Authentication → 登入方式 開啟。',
          'auth/configuration-not-found': 'Firebase 還沒開啟登入功能，請到 Authentication 按「開始使用」並開啟「電子郵件/密碼」。',
          'auth/too-many-requests': '嘗試太多次，請等幾分鐘再試。',
          'auth/network-request-failed': '網路連線失敗，請檢查網路。'
        }[e.code] || ('登入失敗（' + (e.code || e.message) + '）');
        $('#err').innerHTML = `<div class="msg bad">${esc(why)}</div>`;
      }
    };
    $('#in').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };
  }

  function shell(){
    $('#view').innerHTML = `
      <div class="card" id="stockCard"></div>
      <div class="tabs"><button data-t="claim">領袋</button><button data-t="log">名單</button><button data-t="set">設定</button></div>
      <div id="pane" style="display:flex;flex-direction:column;gap:14px"></div>`;
    document.querySelector('.tabs').onclick = e => { if (e.target.dataset.t) { tab = e.target.dataset.t; pane(); } };
    refresh = () => paintStock();
    const cref = R('contacts'); const ch = cref.on('value', s => { contacts = s.val() || {}; if (tab === 'log') paintLog(); }, () => {});
    offContacts = () => cref.off('value', ch);
    watchWeek(WK); paintStock(); pane();
  }

  function watchWeek(wk){
    if (offWeek) offWeek();
    const qy = R('cards').orderByChild('week').equalTo(wk);
    const h = qy.on('value', s => {
      weekCards = Object.entries(s.val() || {}).map(([code, v]) => ({ code, ...v }));
      paintStock(); if (tab === 'log') paintLog();
      sweep(wk);
    });
    offWeek = () => qy.off('value', h);
  }

  function paintStock(){
    const el = $('#stockCard'); if (!el) return;
    const mine = logWeek === WK ? weekCards : [];
    const claimed = mine.filter(c => c.claimed && c.status === 'in').length;
    el.innerHTML = `<div class="stock"><span>本週剩</span><b>${left()}</b><span>/ ${settings.weekly} 名額</span></div>
      <p style="text-align:center;color:var(--muted)">${weekLabel(WK)}｜已達標 ${used()} 人・已領袋 ${claimed} 人・候補 ${mine.filter(isWait).length} 人</p>`;
  }

  function pane(){
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
    const P = $('#pane');
    if (tab === 'claim'){
      P.innerHTML = `
        <div class="card"><h2>輸入民眾集點卡上的 4 碼</h2>
          <div class="row"><input id="code" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="4 碼" style="font-family:var(--mono);font-size:28px;letter-spacing:.2em;text-transform:uppercase"><button id="find" style="flex:0 0 auto">查詢</button></div>
        </div>
        <div class="card" id="res" hidden></div>`;
      $('#find').onclick = find;
      $('#code').onkeydown = e => { if (e.key === 'Enter') find(); };
    } else if (tab === 'log'){
      paintLog();
    } else {
      P.innerHTML = `
        <div class="card"><h2>活動設定</h2>
          <div><label for="wk">每週名額</label><input id="wk" type="number" value="${settings.weekly}"></div>
          <button id="save">儲存設定</button><div id="sMsg"></div>
        </div>
        <div class="card"><h2>民眾集點卡 QR code</h2>
          <div class="qr" id="cqr"></div>
          <p style="text-align:center;font-family:var(--mono);font-size:13px;word-break:break-all">${esc(baseURL)}</p>
          <p class="foot">印出來貼在服務台和各攤位，民眾掃描就能開集點卡。</p>
        </div>
        <div class="card"><h2>帳號</h2>
          <p style="font-size:14px;color:var(--muted)">目前登入：${esc((auth.currentUser?.email || '').replace('@gdnm.life',''))}</p>
          <button class="ghost" id="out">登出</button>
        </div>
        <div class="card"><h2>活動結束後</h2>
          <p style="font-size:14px">11/08 活動結束、核銷資料匯出 CSV 之後，按下面按鈕刪除所有民眾姓名、手機和集點紀錄。</p>
          <button class="red" id="wipe">刪除全部民眾資料</button>
        </div>`;
      new QRCode($('#cqr'), { text: baseURL, width: 440, height: 440 });
      $('#save').onclick = async () => {
        const weekly = Math.max(0, parseInt($('#wk').value, 10) || 0);
        await R('settings').update({ weekly });
        $('#sMsg').innerHTML = `<div class="msg ok">已儲存</div>`;
      };
      $('#out').onclick = () => auth.signOut();
      $('#wipe').onclick = async () => {
        const b = $('#wipe');
        if (!b.dataset.armed){ b.dataset.armed = 1; b.textContent = '確定要刪除全部？再按一次'; return; }
        await R('cards').remove(); await R('contacts').remove(); await R('weeks').remove();
        b.textContent = '已刪除全部民眾資料'; b.disabled = true;
      };
    }
  }

  async function find(){
    curCode = $('#code').value.trim().toUpperCase(); if (curCode.length !== 4) return;
    const v = (await R('cards/' + curCode).get()).val(); cur = v ? { ...v, code: curCode } : null;
    paintRes();
  }

  function paintRes(msg = ''){
    const el = $('#res'); if (!el) return; el.hidden = false;
    if (!cur) { el.innerHTML = `<div class="msg bad">找不到集點卡 ${esc(curCode)}</div>`; return; }
    const items = Object.values(cur.items || {}).sort((a,b) => a.ts - b.ts);
    let state, can = false;
    if (cur.claimed) state = `<span class="pill ok">已領過（${md(cur.claimedDay)} ${hm(cur.claimedAt)}）</span>`;
    else if (cur.status === 'expired' || overdue(cur)) state = `<span class="pill paper">逾期未領，視同放棄</span>`;
    else if (cur.status === 'in' && cur.week === WK) { state = `<span class="pill wait">名額內・清冊第 ${cur.slot} 列</span>`; can = true; }
    else if (cur.status === 'in') state = `<span class="pill paper">上週的名額，未領取</span>`;
    else if (isWait(cur)) state = `<span class="pill paper">候補第 ${cur.waitNo || '?'} 位，尚未遞補</span>`;
    else if (cur.status === 'void') state = `<span class="pill paper">名額已取消</span>`;
    else state = `<span class="pill paper">尚未滿 $${MIN}</span>`;
    el.innerHTML = `
      <div class="kv"><span>姓名</span><b>${esc(cur.name)}</b></div>
      <div class="kv"><span>手機</span><b>${telLink(ph(cur))}</b></div>
      <div class="kv"><span>累計</span><b>${money(cur.total)}</b></div>
      <div>${state}</div>
      <div class="list">${items.map(i => `<div class="item"><span class="code">${esc(i.stall)}</span><div><div class="sub">${md(cur.day)} ${hm(i.ts)}</div></div><b>${money(i.amount)}</b></div>`).join('')}</div>
      ${msg}
      ${can ? `<button class="red" id="give">確認發袋</button>` : ''}`;
    if (can) $('#give').onclick = give;
  }

  async function give(){
    $('#give').disabled = true;
    const r = await R('cards/' + curCode).transaction(c => (c && c.status === 'in' && !c.claimed) ? { ...c, claimed: true, claimedAt: Date.now(), claimedDay: today() } : undefined);
    cur = { ...r.snapshot.val(), code: curCode };
    paintRes(r.committed
      ? `<div class="msg ok" style="font-size:17px"><b>發一個茄芷袋</b><br>請民眾在本週〈民眾簽收清冊〉<b>第 ${cur.slot} 列</b>簽名</div>`
      : `<div class="msg bad">這張卡剛剛已經領過了</div>`);
  }

  function paintLog(){
    const wks = []; for (let d = new Date('2026-10-05T12:00:00Z'); d <= new Date('2026-11-02T12:00:00Z'); d.setUTCDate(d.getUTCDate() + 7)) wks.push(d.toISOString().slice(0,10));
    if (!wks.includes(WK)) wks.push(WK);
    const rows = weekCards.filter(c => c.slot).sort((a,b) => a.slot - b.slot);
    const waits = weekCards.filter(isWait).sort((a,b) => (a.waitNo||0) - (b.waitNo||0));
    const pend = weekCards.filter(c => !c.slot && !isWait(c) && c.total > 0).length;
    $('#pane').innerHTML = `
      <div class="card">
        <div class="row" style="align-items:end">
          <div><label for="lw">週次</label><select id="lw">${[...new Set(wks)].sort().map(w => `<option value="${w}" ${w===logWeek?'selected':''}>${weekLabel(w)}</option>`).join('')}</select></div>
          <button class="ghost" id="csv" style="flex:0 0 auto">匯出 CSV</button>
        </div>
        <p style="color:var(--muted);font-size:13px">清冊序號｜另有 ${pend} 張集點卡累計中未達標</p>
        <div class="list">${rows.length ? rows.map(c => `
          <div class="item" style="${gone(c)?'opacity:.45;text-decoration:line-through':''}">
            <span class="code">#${c.slot}</span>
            <div>${esc(c.name)}・${money(c.total)}<div>${telLink(ph(c))}</div><div class="sub">集點卡 ${c.code}・${md(c.day)} ${hm(c.slotAt)}</div></div>
            ${c.status === 'void' ? '<span class="pill paper">已取消</span>' : c.status === 'expired' ? '<span class="pill paper">逾期放棄</span>' : c.claimed ? '<span class="pill ok">已領</span>' : `<button class="ghost sm" data-void="${c.code}">取消名額</button>`}
          </div>`).join('') : '<p style="color:var(--muted)">這週還沒有人達標。</p>'}</div>
        <p class="foot" style="text-align:left">「取消名額」用在達標後一直沒來領的人，取消後會自動由候補第 1 位遞補。</p>
        <div id="vMsg"></div>
      </div>
      <div class="card"><h2>候補名單（${waits.length} 人）</h2>
        <div class="list">${waits.length ? waits.map(c => `
          <div class="item"><span class="code">候${c.waitNo}</span>
            <div>${esc(c.name)}・${money(c.total)}<div>${telLink(ph(c))}</div><div class="sub">集點卡 ${c.code}・${md(c.day)} ${hm(c.waitAt)}</div></div>
            <span class="pill paper">等待遞補</span></div>`).join('') : '<p style="color:var(--muted)">目前沒有候補。</p>'}</div>
      </div>`;
    $('#lw').onchange = e => { logWeek = e.target.value; watchWeek(logWeek); };
    $('#csv').onclick = exportCSV;
    $('#pane').querySelectorAll('[data-void]').forEach(b => b.onclick = () => {
      if (!b.dataset.armed){ b.dataset.armed = 1; b.textContent = '再按一次確認'; b.classList.add('red');
        return setTimeout(() => { if (b.isConnected){ delete b.dataset.armed; b.textContent = '取消名額'; b.classList.remove('red'); } }, 4000); }
      voidCard(b.dataset.void);
    });
  }

  async function voidCard(code){
    const c = weekCards.find(x => x.code === code); if (!c || c.claimed || c.status !== 'in') return;
    await R('cards/' + code).update({ status: 'void', voidAt: Date.now() });
    await releaseSlot(c.week);
    const p = await promote(c.week);
    const msg = p ? `<div class="msg ok">已由候補第 ${p.waitNo} 位 ${esc(p.name)}（${esc(ph(p))}）遞補，請通知他來領，清冊第 ${p.slot} 列</div>`
                  : `<div class="msg">名額已釋出，目前沒有候補，會留給下一位滿額的民眾</div>`;
    setTimeout(() => { if ($('#vMsg')) $('#vMsg').innerHTML = msg; }, 150);
  }

  // 逾期未領 → 視同放棄，名額自動給候補
  const swept = new Set();
  async function sweep(wk){
    for (const c of weekCards.filter(overdue)){
      if (swept.has(c.code)) continue; swept.add(c.code);
      const r = await R('cards/' + c.code).transaction(x => overdue(x) ? { ...x, status: 'expired', expiredAt: Date.now() } : undefined);
      if (r.committed){ await releaseSlot(c.week); await promote(c.week); }
    }
  }

  // 依候補順序把空出的名額給下一位
  async function promote(wk){
    const list = (await R('cards').orderByChild('week').equalTo(wk).get()).val() || {};
    const waits = Object.entries(list).map(([code, v]) => ({ code, ...v })).filter(isWait).sort((a,b) => (a.waitNo||0) - (b.waitNo||0));
    for (const w of waits){
      const n = await takeSlot(wk); if (!n) return null;
      const r = await R('cards/' + w.code).transaction(c => isWait(c) ? { ...c, status: 'in', slot: n, slotAt: Date.now(), promoted: true } : undefined);
      if (r.committed) return { ...w, slot: n };
      await releaseSlot(wk);                      // 這位剛好不在候補了，換下一位
    }
    return null;
  }

  function exportCSV(){
    const head = ['週次','清冊序號','姓名','手機','累計金額','方式','消費明細','達標時間','狀態'];
    const lines = weekCards.filter(c => c.slot).sort((a,b) => a.slot - b.slot).map(c => [
      weekLabel(c.week), c.slot, c.name, "'" + ph(c), c.total, '集點卡 ' + c.code,
      Object.values(c.items || {}).map(i => `${i.stall} $${i.amount}`).join('；') || '',
      `${md(c.day)} ${hm(c.slotAt)}`, c.status === 'void' ? '已取消' : c.status === 'expired' ? '逾期放棄' : c.claimed ? '已領' : '未領']);
    const csv = '﻿' + [head, ...lines].map(l => l.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = `好市袋著走_${weekLabel(logWeek).replace(/\//g,'')}.csv`; a.click();
  }

  auth.onAuthStateChanged(u => u ? shell() : lock());
}

(MODE === 'desk' ? deskView : customerView)();
</script>
